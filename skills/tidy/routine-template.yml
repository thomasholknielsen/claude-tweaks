template_version: 8
routine_name: tidy-weekly
prompt: >
  Before anything else, fetch origin and confirm this checkout is on {{TARGET_BRANCH}}
  and at its tip. If the container started on a different branch, check the target
  branch out first (`git checkout <branch>`, creating it from `origin/<branch>` if it
  isn't local yet). If it's merely behind, fast-forward it via `git merge --ff-only` —
  never `git reset --hard`. If it has diverged rather than just fallen behind, stop and
  report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Before invoking the skill below, print exactly one line recording which plugin build
  this session resolved AND which path resolved it. Try these in order, stopping at the
  first that yields a readable `.claude-plugin/plugin.json`.

  (1) `env` — if `${CLAUDE_PLUGIN_ROOT}` is set and non-empty, read
  `${CLAUDE_PLUGIN_ROOT}/.claude-plugin/plugin.json`. Never assume it is set: it is
  routinely empty in a cloud Routine sandbox, which is the whole reason the rungs below
  exist.

  (2) `hook-path` — the claude-tweaks SessionStart hook emits its own harness-resolved
  plugin root into this session's context, embedded in a `node "<path>/bin/hooks.js"`
  invocation. That path carries the same authority as (1), since the harness expanded it.
  It is emitted only when the repo has unfinished pipeline runs to report, so it is often
  simply absent — that is normal, not an error.

  (3) `cache-scan` — glob `~/.claude/plugins/cache/*/claude-tweaks/*/.claude-plugin/plugin.json`.
  Exactly one match is unambiguous: report it as `cache-scan-unique`. Two or more means
  the highest-semver directory is a GUESS at which build this session actually loaded —
  report it as `cache-scan-highest-of-N`, N being the candidate count, and never as a
  confirmed answer.

  (4) If nothing resolves, say `claude-tweaks version unresolved (no CLAUDE_PLUGIN_ROOT,
  no hook path, no plugin cache found)` and carry on.

  Format: `claude-tweaks v{version} @ {path} (resolved via: {env | hook-path |
  cache-scan-unique | cache-scan-highest-of-N})`. Never report a version without its
  resolution path — the point is that a hook-derived answer is stronger evidence than a
  directory guess, and a bare version string hides which one you got. Diagnostic only —
  never a gate, never a reason to stop — but without it a sandbox pinned to a stale
  plugin build and a real bug in the current build are indistinguishable from the
  outside.

  Regardless of which rung resolved, also run `claude plugin list --json` once and print
  its output verbatim (fall back to `ls -la ~/.claude/plugins/cache/*/*/ 2>&1` if that
  command errors). This is the single, deterministic listing of every plugin actually
  installed, not just claude-tweaks — printing it now means a later diagnostic pass, if
  one becomes necessary, doesn't have to re-derive the same fact through several more
  exploratory commands.

  If all four rungs above came up empty (`unresolved`), the plugin cache is genuinely
  empty. Do not attempt the kickoff below first — invoking a skill against zero installed
  plugins fails predictably and only spends a turn re-establishing what the `unresolved`
  line already established. First, read `$HOME/claude-cloud-setup.log` and print exactly
  one line: `claude-cloud-setup.log: absent — the environment Setup script left no trace
  in this container (not executed, or its write failed)` or `claude-cloud-setup.log:
  present — tail: {last 5 lines}`. Absence is evidence, not proof — a failed log write is
  indistinguishable from non-execution from inside the container. The full log stays on
  disk for a deeper look within this session. Go straight to `bash
  scripts/claude-cloud-setup.sh` to self-heal (the same script this project's cloud
  environment's Setup script field should already run automatically — if it simply wasn't
  invoked for this container, this repairs it for the rest of this session), then re-run
  the resolved-build line once before proceeding to the kickoff.

  If, after a successful self-heal, invoking the kickoff skill below via the Skill tool
  still fails with an unknown- or unrecognized-skill error — the deterministic signal
  that this session's skill catalog was frozen before the install — do not stop there:
  read `<path>/skills/<skill>/SKILL.md`, where `<path>` is the path component the
  just-printed resolved-build line reported (it exists by construction — this clause
  fires only after that line succeeded) and `<skill>` is the kickoff skill named on the
  `Then:` line below, and execute that file's instructions directly, following them as
  written (frontmatter, the interaction-style directive, each step) rather than
  summarizing them. One exclusion, stated with its principle: if the kickoff below is
  `/claude-tweaks:dispatch`, do not execute it manually — report the degraded sandbox and
  stop. Dispatch claims queue records and triggers builds and merges — standing effects
  beyond a report — and any future routine whose skill claims work or writes beyond
  report-only surfaces gets the same exclusion.

  Then: /claude-tweaks:tidy
# Optional: `branch: <name>` pins the prompt's {{TARGET_BRANCH}}. Normally unset here — a
# branch is project-specific, so /claude-tweaks:routine resolves it at instantiation.
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Task]
mcp_connections: []
default_schedule:
  cron_expression: "0 4 * * 0"
  description: "off-peak anchor, UTC, weekly on Sunday — confirm against your local timezone at creation time"
notes: >
  Tidy already has first-class standalone-auto support: Step 6's aggressiveness
  routing (conservative by default) stages judgment-requiring items to
  decisions.md rather than blocking on interactive input, and auto-applies only
  the safe, atomic actions (stale deletes, cleanly-merged worktree/branch
  removals). This only takes effect when the target project's own CLAUDE.md
  already sets `auto-mode: default-on` — a bare scheduled firing has no other
  way to supply an auto-mode signal, and without that project policy the
  routine will block on an interactive prompt that never gets answered. `Task`
  is included in allowed_tools so tidy's parallel-agent scan (Steps 1, 3, 4,
  4.5, 4.6, 4.7, 4.8, and 5.5) can dispatch as designed; if Task-based
  subagent dispatch isn't supported in a given cloud routine session, those
  steps degrade to running sequentially instead. See skills/tidy/SKILL.md's
  "Standalone auto" fallback and its own
  Routine Configuration section for tuning guidance, and
  skills/_shared/auto-mode-contract.md for the mode-precedence rules.
