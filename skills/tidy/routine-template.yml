template_version: 4
routine_name: tidy-weekly
prompt: >
  Before anything else, fetch origin and confirm this checkout is on {{TARGET_BRANCH}}
  and at its tip. If the container started on a different branch, check the target
  branch out first (`git checkout <branch>`, creating it from `origin/<branch>` if it
  isn't local yet). If it's merely behind, fast-forward it via `git merge --ff-only` —
  never `git reset --hard`. If it has diverged rather than just fallen behind, stop and
  report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Then: /claude-tweaks:tidy
# Optional: `branch: <name>` pins the prompt's {{TARGET_BRANCH}}. Normally unset here — a
# branch is project-specific, so /claude-tweaks:routine resolves it at instantiation.
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Task]
mcp_connections: []
default_schedule:
  cron_expression: "0 4 * * 0"
  description: "off-peak anchor, UTC, weekly on Sunday — confirm against your local timezone at creation time"
notes: >
  Tidy already has first-class standalone-auto support: Step 6's aggressiveness
  routing (conservative by default) stages judgment-requiring items to
  decisions.md rather than blocking on interactive input, and auto-applies only
  the safe, atomic actions (stale deletes, cleanly-merged worktree/branch
  removals). This only takes effect when the target project's own CLAUDE.md
  already sets `auto-mode: default-on` — a bare scheduled firing has no other
  way to supply an auto-mode signal, and without that project policy the
  routine will block on an interactive prompt that never gets answered. `Task`
  is included in allowed_tools so tidy's parallel-agent scan (Steps 1, 3, 4,
  4.5, 4.6, 4.7, 4.8, and 5.5) can dispatch as designed; if Task-based
  subagent dispatch isn't supported in a given cloud routine session, those
  steps degrade to running sequentially instead. See skills/tidy/SKILL.md's
  "Standalone auto" fallback and its own
  Routine Configuration section for tuning guidance, and
  skills/_shared/auto-mode-contract.md for the mode-precedence rules.
