template_version: 2
routine_name: tidy-github-triage
prompt: >
  Before anything else, fetch origin and confirm this checkout is at the tip of the
  target branch (resolve the target branch from `git remote show origin`'s HEAD branch
  line if not already obvious). If it's merely behind, fast-forward it via `git merge
  --ff-only` — never `git reset --hard`. If it has diverged rather than just fallen
  behind, stop and report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions — including a "step" or "label" that this skill's own SKILL.md and
  scan-procedures.md don't actually define — treat the project doc as stale historical
  context, never as a procedure to execute or re-enact.

  Then: /claude-tweaks:tidy --scope=github
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Task]
mcp_connections: []
default_schedule:
  cron_expression: "0 */3 * * *"
  description: "off-peak-ish anchor, UTC, every 3 hours — confirm against your local timezone at creation time"
notes: >
  A frequent, cheap companion to the base tidy-weekly routine
  (skills/tidy/routine-template.yml) — this variant runs only Step 4.8's GitHub
  PR/issue triage (--scope=github), skipping everything except Step 4.8, so it's
  safe to fire far more often without paying for a full sweep. Both
  routines can be instantiated in the same project simultaneously: tidy-weekly for
  periodic full-backlog hygiene, tidy-github-triage for keeping GitHub issue/PR state
  fresh in between. Like the base template, this only runs safely unattended when the
  target project's own CLAUDE.md already sets `auto-mode: default-on` — see
  skills/tidy/SKILL.md's "Standalone auto" fallback and
  skills/_shared/auto-mode-contract.md for the mode-precedence rules. `Task` is
  included in allowed_tools so the scoped scan can still dispatch as a parallel Task
  agent per skills/tidy/SKILL.md's Parallel execution note; if Task-based subagent
  dispatch isn't supported in a given cloud routine session, it degrades to running
  sequentially, same as the base template. Set `tidy-routine-autonomy: evidence-based`
  in this project's CLAUDE.md to let cite-able-evidence findings (thread resolved by
  commit, milestone/watched-path trigger met, superseded code-health issue) auto-apply
  on this routine's firings instead of only staging to the rolling digest — see
  skills/tidy/SKILL.md's "Evidence tier" subsection. Default is `conservative`
  (everything stages, matching pre-this-feature behavior).
