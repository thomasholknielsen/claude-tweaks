template_version: 2
routine_name: triage-dispatch
prompt: >
  Before anything else, fetch origin and confirm this checkout is at the tip of the
  target branch (resolve the target branch from `git remote show origin`'s HEAD branch
  line if not already obvious). If it's merely behind, fast-forward it via `git merge
  --ff-only` — never `git reset --hard`. If it has diverged rather than just fallen
  behind, stop and report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Then: /claude-tweaks:triage dispatch
model: claude-sonnet-5
allowed_tools: [Bash, Read, Edit, Write, Grep, Glob, Task]
mcp_connections: []
default_schedule:
  cron_expression: "0 4 * * 1-5"
  description: "weekday off-peak anchor, UTC — confirm against your local timezone at creation time"
notes: >
  Headless issue dispatcher: each firing pulls tier:approved/tier:fast-track
  issues, claims them, and hands each to /claude-tweaks:flow #{issue} for pure
  execution. The claim ref makes overlapping firings harmless (a second firing
  skips claimed issues), and a failed run retries at a later firing once its
  claim ages out (TTL) — up to the triage-retry-ceiling policy flag, after which
  the issue is relabeled status:blocked and stops auto-retrying. Only this
  skill's bare (interactive) invocation ever grants a tier:needs-review/
  tier:approved/tier:fast-track label an issue didn't already have —
  dispatch mode may only downgrade or strip a tier it reads (fast-track to
  approved on failure, or removed plus status:blocked at the retry ceiling);
  it revokes trust, never grants it. Scheduling this routine is not sufficient on
  its own to make a code-health/harness-health routine's filed issues progress —
  something still has to run bare `/claude-tweaks:triage` periodically (a human,
  interactively) to grant the first tier label before this routine has anything
  to pick up.
  A fast-track issue whose run comes back clean (per the four-layer auto-merge
  gate) merges without waiting at the Review Console; anything less than clean
  falls back to a normal wait. Each firing that dispatches work ends at its
  consolidated Review Console (for tier:approved issues, or any tier:fast-track
  issue that didn't come back clean) awaiting the user's answer in the cloud
  session; an unanswered console's claims age out via TTL and a later firing
  supersedes the run. A firing with no eligible issues is a cheap no-op.
  Subagent execution requires the Task tool (in allowed_tools) and the
  superpowers plugin in the cloud environment.
