template_version: 2
routine_name: code-health-daily
prompt: >
  Before anything else, fetch origin and confirm this checkout is at the tip of the
  target branch (resolve the target branch from `git remote show origin`'s HEAD branch
  line if not already obvious). If it's merely behind, fast-forward it via `git merge
  --ff-only` — never `git reset --hard`. If it has diverged rather than just fallen
  behind, stop and report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Then: /claude-tweaks:code-health
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob]
mcp_connections: []
default_schedule:
  cron_expression: "0 3 * * *"
  description: "off-peak anchor, UTC — confirm against your local timezone at creation time"
notes: >
  Code-health's own next-slice rotation makes a skipped or repeated firing harmless — no
  --area flag is passed, so next-slice always picks the highest-priority slice
  automatically. See skills/code-health/SKILL.md's "Routine Configuration" section for
  the --budget / token-cap tuning guidance this template doesn't need to restate. Filed
  issues are born-ready — each carries risk:<tier>/effort:<tier> labels and the ready
  label already applied at filing time, so they land directly in the authorization
  gate's worklist with no manual tiering step; a human still needs to periodically run
  bare `/claude-tweaks:triage` to actually authorize (grant auto:build/auto:merge)
  those ready findings for autonomous building.
