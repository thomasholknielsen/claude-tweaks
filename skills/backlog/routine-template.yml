template_version: 2
routine_name: backlog-grant-weekdays
prompt: >
  Before anything else, fetch origin and confirm this checkout is on {{TARGET_BRANCH}}
  and at its tip. If the container started on a different branch, check the target
  branch out first (`git checkout <branch>`, creating it from `origin/<branch>` if it
  isn't local yet). If it's merely behind, fast-forward it via `git merge --ff-only` —
  never `git reset --hard`. If it has diverged rather than just fallen behind, stop and
  report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Before invoking the skill below, print exactly one line recording which plugin build
  this session resolved AND which path resolved it. Try these in order, stopping at the
  first that yields a readable `.claude-plugin/plugin.json`.

  (1) `env` — if `${CLAUDE_PLUGIN_ROOT}` is set and non-empty, read
  `${CLAUDE_PLUGIN_ROOT}/.claude-plugin/plugin.json`. Never assume it is set: it is
  routinely empty in a cloud Routine sandbox, which is the whole reason the rungs below
  exist.

  (2) `hook-path` — the claude-tweaks SessionStart hook emits its own harness-resolved
  plugin root into this session's context, embedded in a `node "<path>/bin/hooks.js"`
  invocation. That path carries the same authority as (1), since the harness expanded it.
  It is emitted only when the repo has unfinished pipeline runs to report, so it is often
  simply absent — that is normal, not an error.

  (3) `cache-scan` — glob `~/.claude/plugins/cache/*/claude-tweaks/*/.claude-plugin/plugin.json`.
  Exactly one match is unambiguous: report it as `cache-scan-unique`. Two or more means
  the highest-semver directory is a GUESS at which build this session actually loaded —
  report it as `cache-scan-highest-of-N`, N being the candidate count, and never as a
  confirmed answer.

  (4) If nothing resolves, say `claude-tweaks version unresolved (no CLAUDE_PLUGIN_ROOT,
  no hook path, no plugin cache found)` and carry on.

  Format: `claude-tweaks v{version} @ {path} (resolved via: {env | hook-path |
  cache-scan-unique | cache-scan-highest-of-N})`. Never report a version without its
  resolution path — the point is that a hook-derived answer is stronger evidence than a
  directory guess, and a bare version string hides which one you got. Diagnostic only —
  never a gate, never a reason to stop — but without it a sandbox pinned to a stale
  plugin build and a real bug in the current build are indistinguishable from the
  outside.

  Regardless of which rung resolved, also run `claude plugin list --json` once and print
  its output verbatim (fall back to `ls -la ~/.claude/plugins/cache/*/*/ 2>&1` if that
  command errors). This is the single, deterministic listing of every plugin actually
  installed, not just claude-tweaks — printing it now means a later diagnostic pass, if
  one becomes necessary, doesn't have to re-derive the same fact through several more
  exploratory commands.

  If all four rungs above came up empty (`unresolved`), the plugin cache is genuinely
  empty. Do not attempt the kickoff below first — invoking a skill against zero installed
  plugins fails predictably and only spends a turn re-establishing what the `unresolved`
  line already established. First, read `$HOME/claude-cloud-setup.log` (via `tail -5
  "$HOME/claude-cloud-setup.log"` or equivalent — shell expansion, not a literal path) and
  print exactly one line: `claude-cloud-setup.log: absent — the environment Setup script
  left no trace in this container (not executed, or its write failed)` or
  `claude-cloud-setup.log: present — tail: {last 5 lines}`. Absence is evidence, not
  proof — a failed log write is indistinguishable from non-execution from inside the
  container. The full log stays on
  disk for a deeper look within this session. Go straight to `bash
  scripts/claude-cloud-setup.sh` to self-heal (the same script this project's cloud
  environment's Setup script field should already run automatically — if it simply wasn't
  invoked for this container, this repairs it for the rest of this session), then re-run
  the resolved-build line once before proceeding to the kickoff.

  If, after a successful self-heal, invoking the kickoff skill below via the Skill tool
  still fails with an unknown- or unrecognized-skill error — the deterministic signal
  that this session's skill catalog was frozen before the install — do not stop there:
  read `<path>/skills/<skill>/SKILL.md`, where `<path>` is the plugin root (the directory
  containing `.claude-plugin/`, not the `plugin.json` file inside it; it exists by
  construction — this clause fires only after that line succeeded) and `<skill>` is the
  kickoff skill named on the `Then:` line below, including any arguments that line
  carries (they are part of the invocation, not decoration), and execute that file's
  instructions directly, following them as written (frontmatter, the interaction-style
  directive, each step) rather than summarizing them. One exclusion, stated with its
  principle: if the kickoff below is `/claude-tweaks:dispatch` or `/claude-tweaks:tidy`,
  do not execute it manually — report the degraded sandbox and stop. Dispatch claims
  queue records and triggers builds and merges, and tidy's standalone-auto mode applies
  deletions (stale records, merged branches and worktrees) — standing effects beyond a
  report — and any future routine whose skill claims work or writes beyond report-only
  surfaces gets the same exclusion.

  Before the kickoff below, run reconcile using whichever plugin root resolved above:
  `node "<plugin-root>/bin/hooks.js" reconcile`. Report its one-line JSON result. This
  converges local state toward origin before the skill starts — mirrors the integration
  branch, releases finished claims, archives closed runs, and reaps merged worktrees
  under `pr-first` (`bin/lib/reconcile`, #407); under `local-merge` only the worktree
  reap runs. Diagnostic and best-effort like the resolved-build line above — never a
  gate, never a reason to stop the kickoff.

  Then: /claude-tweaks:backlog grant
# Optional: `branch: <name>` pins the prompt's {{TARGET_BRANCH}}. Normally unset here — a
# branch is project-specific, so /claude-tweaks:routine resolves it at instantiation.
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob]
mcp_connections: []
default_schedule:
  cron_expression: "30 3 * * 1-5"
  description: "weekday off-peak anchor, UTC, slotted between the finder routines and dispatch — confirm against your local timezone at creation time"
notes: >
  Headless machine-grant unit: each firing sweeps the `ready` queue and applies
  `auto:build` (+ `auto:merge` when its own checks clear) to every candidate whose gate
  chain fully clears — see `skills/backlog/grant-mode.md`'s Step 0-4. This is the one
  machine-origination path for `auto:build`/`auto:merge` — everything else in the fleet
  (this routine included) only downgrades or strips a grant it reads, never originates
  one, except this mode itself, which is gated behind the `unattended` ceiling plus its
  own `grant-origination-enabled` opt-in (both must be set in `.claude-tweaks/policy.yml`
  or the whole firing is a no-op — grant-mode.md Step 0). A firing with the ceiling gate
  unsatisfied, or with no eligible candidates in the `ready` queue, is a cheap no-op
  (report nothing, exit clean), mirroring dispatch's own no-eligible-candidates
  convention. No candidate is ever human-filed (agent `by:*` origin is a hard gate), and
  no per-record `AskUserQuestion` fires — the gate chain decides, not a human. Grants and
  skips are logged one line each to this run's `decisions.md`, and every grant posts an
  evidence-snapshot comment on the record itself (`grant-mode.md`'s Audit format) — the
  durable trace of what a headless firing decided and why. `fleet-daily-grant-cap` (when
  configured) can stop mid-firing, self-correcting on the next firing per grant-mode.md's
  Concurrency section. Scheduling this routine alone does not make it grant anything: the
  two-key opt-in above is a deliberate, human-set ceiling — this routine only becomes
  live once a human has turned both keys on.
