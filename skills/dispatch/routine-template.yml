# Migration note: a Routine created from /claude-tweaks:triage's old template still
# fires "triage dispatch", a skill that no longer exists (grants now live at
# /claude-tweaks:backlog refine). Re-create it via
# `/claude-tweaks:routine create dispatch` (this template) — the old routine keeps
# firing a dead prompt until you replace or delete it at claude.ai/code/routines.
template_version: 4
routine_name: dispatch-weekdays
prompt: >
  Before anything else, fetch origin and confirm this checkout is on {{TARGET_BRANCH}}
  and at its tip. If the container started on a different branch, check the target
  branch out first (`git checkout <branch>`, creating it from `origin/<branch>` if it
  isn't local yet). If it's merely behind, fast-forward it via `git merge --ff-only` —
  never `git reset --hard`. If it has diverged rather than just fallen behind, stop and
  report that instead of proceeding on unverified state.

  If any project documentation (CLAUDE.md, rules, README) describes this skill's past
  or historical behavior in a way that doesn't match this skill's own current
  instructions, treat the project doc as stale historical context — never as a
  procedure to execute.

  Before invoking the skill below, print one line recording which plugin build this
  session actually resolved: read `${CLAUDE_PLUGIN_ROOT}/.claude-plugin/plugin.json`
  and report `claude-tweaks v{version} @ {resolved CLAUDE_PLUGIN_ROOT}`, saying so
  plainly if either is missing or unreadable. Diagnostic only — never a gate, never a
  reason to stop — but without it a sandbox pinned to a stale plugin build and a real
  bug in the current build are indistinguishable from the outside.

  Then: /claude-tweaks:dispatch next
# Optional: `branch: <name>` pins the prompt's {{TARGET_BRANCH}}. Normally unset here — a
# branch is project-specific, so /claude-tweaks:routine resolves it at instantiation.
model: claude-sonnet-5
allowed_tools: [Bash, Read, Edit, Write, Grep, Glob, Task]
mcp_connections: []
default_schedule:
  cron_expression: "0 4 * * 1-5"
  description: "weekday off-peak anchor, UTC — confirm against your local timezone at creation time"
notes: >
  Headless queue consumer: each firing selects exactly one file-overlap group from the
  authorized queue (open + auto:build, no bot:*, unclaimed), claims every member of that
  group, and hands it to /claude-tweaks:flow for pure execution. The claim ref makes
  overlapping firings harmless — a second firing's queue pull skips anything already
  claimed — and a failed run releases its claim and retries at a later firing, up to the
  dispatch-retry-ceiling policy flag (default 3), after which auto:build is removed,
  bot:blocked is added, and the record stops auto-retrying. Only /claude-tweaks:backlog refine's
  interactive invocation ever grants auto:build/auto:merge a record didn't already have —
  this routine only downgrades or strips a grant it reads (auto:merge revoked for a
  correctness/ambiguous-classified failure, preserved for a transient one, per
  assess-agent-autonomy's failure-check mode; auto:build removed at the retry ceiling); it
  revokes trust, never grants it. Scheduling this routine alone is not enough to make a
  code-health/harness-health/journey-health/docs-health routine's filed issues progress — a human
  still has to run `/claude-tweaks:backlog refine` periodically to grant auto:build before
  this routine has anything to pick up. A group whose run comes back clean (per the
  two-layer auto-merge gate, assess-agent-autonomy's merge-check mode verdicting auto-merge)
  merges without waiting, when every member carries
  auto:merge; anything less than clean falls back to a normal pending-review wait. There
  is no consolidated multi-group console — each firing reports only its own group's
  outcome; the aggregate picture surfaces over time via /claude-tweaks:tidy's own periodic
  GitHub/PR sweep. A pending-review outcome parks (branch and run dir wait for a
  human, or the claim's TTL expires and a later firing supersedes it); a firing with no
  eligible groups is a cheap no-op. Subagent execution requires the Task tool (in
  allowed_tools) and the superpowers plugin in the cloud environment.
