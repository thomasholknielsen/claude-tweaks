    kind: npm-cli
    installed-probe:
      type: command
      run: "true"
    pinned: "0.0.1"
    upstream:
      repo: "example/bare-minimum"
      tag-prefix: "v"
    contract-paths: []
    assertions: []
    fixtures: []
