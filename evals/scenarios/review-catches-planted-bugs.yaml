name: review-catches-planted-bugs
description: >
  Does /claude-tweaks:review find planted defects of known severity without
  false-positiving on clean code nearby?
fixture:
  base: minimal-node-repo
  seed:
    - apply-patch: planted-bugs.patch
skill_invocation:
  # No answer_overrides for "review-effort": this is a bare, no-argument
  # invocation, and skills/review/SKILL.md's Step 2.5 only poses a
  # review-effort AskUserQuestion when an explicit argument or a work-record's
  # risk/effort labels are available — neither applies here, so the tier is
  # resolved silently via a git-diff-size heuristic instead, with no question
  # to override (confirmed empirically: a "high" override left in place here
  # for one real run had no effect — the tier that actually ran was still
  # "medium", per the resolved diff heuristic). Forcing a specific tier would
  # require an explicit effort token in the prompt itself (e.g.
  # "/claude-tweaks:review high", per SKILL.md's own documented grammar) —
  # not done here, since letting the tier resolve naturally is both cheaper
  # (fewer lenses at medium) and, now that parse-findings-table.js parses any
  # table shape via its Severity column instead of a fixed heading/column
  # layout, no longer needs a specific tier to produce parseable output.
  prompt: "/claude-tweaks:review"
assertions:
  # Severities and `contains` values below reflect real end-to-end runs'
  # actual output, not the pre-run guesses in the original brief (matched on
  # file path). The review classified the SQL-injection-shaped bug Critical
  # (Security lens) and the off-by-one High (Error handling lens) across
  # every real run, at both "medium" and "high" tiers. `contains` was
  # originally matched on the file path (e.g. "src/auth.js"), but the live
  # skill's findings table has no single, stable file/line column across
  # observed shapes — matched instead on content that appeared in every real
  # run regardless of table shape: "SQL injection" (the vulnerability class)
  # and "lastNItems" (the affected function's own name, a hard identifier
  # less prone to LLM paraphrase than a descriptive term).
  - type: findings-include
    severity: critical
    contains: "SQL injection"
  - type: findings-include
    severity: high
    contains: "lastNItems"
  - type: findings-exclude-false-positive
    files: ["src/clean-module.js"]
  # max: 60 was a pre-flight guess written before any real run existed. The
  # real /claude-tweaks:review pipeline is a full multi-step quality gate
  # (test gate, multi-lens parallel reproduction-pair dispatch, Implementation
  # Hindsight via /reflect, /simplify, /visual-review discover, the design
  # wrapper) — Task 6's first real end-to-end run legitimately used 245 tool
  # calls reviewing just two tiny files. Recalibrated with headroom for
  # run-to-run lens-dispatch variance; this remains a sanity ceiling against
  # genuinely runaway behavior, not a tight budget.
  - type: tool-count
    max: 400
