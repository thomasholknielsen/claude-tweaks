name: deepen-flags-planted-passthrough
description: >
  Does /claude-tweaks:deepen's two-stage discipline hold on a planted
  pass-through module? Stage 1 must classify src/store-wrapper.js as a
  collapse candidate (never dressed up as a deepening — the skill's own
  anti-pattern), and when the actor declines to explore any candidate,
  the run must end with zero code changes and the wrapper intact — the
  runaway-rewrite guard the two-stage split exists to enforce. The
  decline must also persist to .claude-tweaks/deepen/declines.md (the
  skill's decline memory), so a later run re-presents it pre-marked
  rather than as first-seen. NOT YET CALIBRATED against a real run —
  authored alongside the decline-memory/collapse-fast-lane skill change;
  per README's "Adding a scenario", run it once for real and adjust
  before trusting its assertions as pinned.
fixture:
  base: depth-repo
  seed: []
skill_invocation:
  prompt: "/claude-tweaks:deepen src/"
answer_overrides:
  # Step 3's multiSelect exploration question — decline every candidate.
  # The skill's own "none" path must then skip Steps 4-5 entirely and
  # render the Report with the candidate recorded as declined.
  - match: "candidates would you like to explore"
    answer: "None — do not explore any candidate this run"
assertions:
  # The candidate table (or the Report's declined list) must put the
  # wrapper and its collapse classification on the same line.
  - type: result-contains
    within: "store-wrapper"
    contains: "collapse"
  # Declining means no code changes: wrapper still present, no commits
  # beyond freshRepo's init + the base-fixture seed, tests still green.
  - type: file-exists
    path: src/store-wrapper.js
  - type: commit-count
    max: 2
  - type: test-passes
    command: "node --test test/*.test.js"
  # Decline memory: the passed-on candidate persists across runs.
  - type: file-exists
    path: .claude-tweaks/deepen/declines.md
  - type: tool-count
    max: 40
