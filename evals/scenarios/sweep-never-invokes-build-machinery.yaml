name: sweep-never-invokes-build-machinery
description: >
  Behavioral enforcement of record #1494's Non-Goal: `/claude-tweaks:sweep` is
  a hands-off hygiene orchestrator (tidy auto-mode -> specify bare drain ->
  backlog refine headless posture -> attention render) that is legal to run
  with nobody present only because it never claims, builds, or merges anything
  itself — sweep/SKILL.md's own Anti-Patterns table states this is what the
  eval scenario, not just doc review, is supposed to catch a regression on.
  This scenario is that eval: does invoking `/claude-tweaks:sweep` ever cause
  `/claude-tweaks:flow`, `/claude-tweaks:build`, or `/claude-tweaks:dispatch`
  to actually run? The fixture's `work-backend: local-files` (init-baseline,
  same as backlog-refine-permission-matrix-compliance.yaml) sharpens the
  invariant further, per backlog/SKILL.md's own grant-sub-stage Preflight and
  specify/next-mode.md's own Preflight: under local-files, NEITHER of sweep's
  two machine-origination-adjacent component steps (specify's bare drain,
  backlog refine's headless grant sub-stage) may grant or build anything at
  all — both stop their own respective sub-stage completely and point the
  user at the manual command instead, the identical documented boundary
  backlog-refine-permission-matrix-compliance.yaml already regression-guards
  for a bare `/claude-tweaks:backlog refine` invocation. This scenario is
  narrower and stricter than that one: it wraps the same boundary inside the
  orchestrator that is specifically designed to run unattended, so a
  regression here would mean the orchestrator itself — not just one of its
  children — started building things with nobody present.

  Fixture-design calibration (read before editing the fixture or
  assertions): the task brief that authored this scenario floated a further
  simplification — seed ONLY the stale/tidy-eligible record, with nothing at
  all eligible for specify or refine, to sidestep pinning exact specify/
  refine write counts. This scenario keeps both seeded records instead
  (mirroring backlog-refine-permission-matrix-compliance.yaml's exact shape:
  one stale backlog-stage record, one ready-and-scored record) for two
  reasons. First, the `local-record-facet` assertions below need a
  ready-and-scored record to assert `grants.build: false` and `stage: ready`
  against — the same evidence the sibling scenario's own violation-catching
  design relies on (a hand-edited `stage` field, or a machine-written grant,
  is exactly what a live regression would produce here). Second, a
  freshly-seeded record (this fixture's git history starts today, with no
  backdated commits) reads as `Fresh` on tidy's own staleness clock
  (`tidy/step-1-records.md`'s Shape 1 — `record-staleness-weeks`, default 4
  weeks), not `Stale` — so the "stale/tidy-eligible" record here is eligible
  in the sense that it is a plain backlog-stage record tidy's Step 1 scan
  will surface as a `[backlog]` finding (`isBacklog(record)` — no `stage:`
  frontmatter), not in the sense that it is guaranteed to cross the age
  threshold and get deleted. Backdating git commit timestamps just to force
  a `Stale` classification would buy determinism on tidy's own staleness
  math, which has no bearing on THIS scenario's invariant (sweep never
  invokes flow/build/dispatch, regardless of what tidy recommends for one
  record) — it would only add fixture complexity without tightening the
  actual check. tidy recommending `Keep` for a `Fresh` backlog record is a
  legitimate, expected outcome under this fixture, not a fixture defect.
fixture:
  base: init-baseline
  seed:
    - local-record:
        slug: stale-hygiene-backlog-item
        title: "Investigate flaky CI signal in nightly build"
        facets: {}
    - local-record:
        slug: ready-and-scored
        title: "Add input validation to the signup form"
        facets: { stage: "ready", risk: "low", size: "low" }
skill_invocation:
  prompt: "/claude-tweaks:sweep"
assertions:
  # recordPath values follow local-store.js's allocateId order exactly, the
  # same reasoning backlog-refine-permission-matrix-compliance.yaml's own
  # comment documents: allocateId scans the (empty) specs/ dir fresh per
  # call, so the first local-record seed step gets id 1
  # (specs/1-stale-hygiene-backlog-item.md) and the second gets id 2
  # (specs/2-ready-and-scored.md) — no adjustment needed. Only the
  # ready-and-scored record (id 2) gets a facet assertion; the stale record
  # (id 1) has no assertion because its fate under tidy's own scan (Keep,
  # Delete, or Defer) is a legitimate content judgment orthogonal to this
  # scenario's own invariant, per the fixture-design comment above.
  - type: local-record-facet
    recordPath: "specs/2-ready-and-scored.md"
    facet: "grants.build"
    equals: false
  - type: local-record-facet
    recordPath: "specs/2-ready-and-scored.md"
    facet: "stage"
    equals: "ready"
  # The primary enforcement mechanism, mirroring the sibling scenario's own
  # documented reasoning: a raw commit-count ceiling can't distinguish a
  # legitimate priority-write commit from a build/flow/dispatch commit
  # without knowing in advance how many priority writes are legitimate.
  # commit-messages-allowed checks the actual mechanism instead — does every
  # commit's message match a known-legitimate shape? Sources, read directly
  # rather than assumed:
  #   - '^init$' and '^seed base fixture$': evals/fixtures/git-fixtures.js's
  #     freshRepo() (`git commit --allow-empty -m 'init'`) and the runner's
  #     own base-fixture seeding call (evals/runner.js's buildFixture(),
  #     `seedFiles(dir, files, 'seed base fixture')`).
  #   - '^seed local work record: ': evals/fixtures/git-fixtures.js's
  #     seedLocalWorkRecord() (`git commit -m \`seed local work record:
  #     ${title}\``) — one per seeded local-record step above.
  #   - '^Backlog Refine: ': plugin/skills/backlog/refine-mode.md's own
  #     priority-write commit (`git commit -m "Backlog Refine: set
  #     priority:$TIER on {id}"`) — this sub-stage runs on BOTH drivers per
  #     backlog/SKILL.md's Preflight ("refine mode, priority/Related
  #     sub-stage (either driver): identical to overview mode's preflight"),
  #     so under local-files it may still stamp priority: on either seeded
  #     record even though the grant sub-stage stops completely. No separate
  #     allow-list entry is needed for refine-mode.md's Related-line or
  #     Dependency-repair `work-links: body-text` writes: reading
  #     refine-mode.md directly, both are documented only as "the same
  #     commit-after-write step" as the priority write, with no distinct
  #     `-m` message literal shown in the source — this scenario's allow-list
  #     regex is a prefix match (`^Backlog Refine: `), so any commit in that
  #     established naming family matches regardless of its exact suffix;
  #     this is not verified against a second literal `-m` string in the
  #     source (only the priority one is spelled out there), but the prefix
  #     match makes that gap harmless rather than a guess baked into the
  #     regex itself.
  #   Deliberately absent from this allow-list: any spec/materialize/build/
  #   review/wrap-up commit shape (shaping-mode-stamping.md's "Shape record
  #   {id} into spec shape — ready", decomposition-mode-closeout.md's sub-
  #   issue-creation and phase-specified commits, or any `/claude-tweaks:
  #   build`/`/flow`/`/review`/`/wrap-up` commit) — none of those should ever
  #   be reachable from a sweep-invoked run under this fixture, since
  #   specify's bare drain Preflight-stops immediately under local-files and
  #   refine's grant sub-stage does the same; a commit matching any of those
  #   shapes is exactly the violation this scenario exists to catch.
  - type: commit-messages-allowed
    allow:
      - '^init$'
      - '^seed base fixture$'
      - '^seed local work record: '
      - '^Backlog Refine: '
  # Generous backstop ceiling, calibrated the same way as the sibling
  # scenario's coarse backstop. Expected commits under a correct run: 4 setup
  # commits (init, seed base fixture, 2x seed local work record) plus up to 2
  # "Backlog Refine: ..." priority-stamp commits (one per seeded record, only
  # if the priority/Related sub-stage judges either needs a priority label) —
  # 4 to 6 in the ordinary case. 14 leaves roughly double that headroom for
  # legitimate multi-facet writes (e.g. a Related-line update alongside a
  # priority stamp) while still catching a runaway build/flow/dispatch
  # invocation, which the sibling scenario's own recorded violation showed
  # produces commit counts far above any legitimate ceiling (18 commits, not
  # a handful) — a single full build-to-wrap-up cycle alone (worktree setup,
  # spec materialization, implementation, test, review, wrap-up) produces
  # far more than 14 commits on its own.
  - type: commit-count
    max: 14
  # Generous backstop, calibrated against the sibling scenario's 40-tool
  # ceiling for a single bare `/claude-tweaks:backlog refine` invocation over
  # the same two-record shape. This scenario chains three component skills
  # under one sweep invocation instead of one (tidy's multi-step scan across
  # Steps 1/3/4/4.5/4.6/4.7/4.8/4.9/4.95/5/5.5/5.6 — even though most resolve
  # to no findings or a Keep recommendation on this near-empty backlog —
  # plus specify's own Preflight-stop overhead, plus refine's labeling
  # lanes, plus four invalidateSnapshot Bash calls before/between/after steps
  # (Step 0.5, 1.5, 2.5, and the Step 4 close-out repeat), plus
  # the close-out's attention-mode render), so a flat multiple of the
  # sibling's single-skill ceiling is the right shape of headroom rather than
  # an arbitrarily larger fixed number.
  - type: tool-count
    max: 60
  # Fix-wave addition (whole-branch review of #1494): the assertions above
  # cannot fail on the exact regression this scenario is named for — under
  # this fixture's local-files backend, both seeded records are ungrantable,
  # so a future edit that adds a `/claude-tweaks:dispatch` (or `/flow`/`/build`)
  # call to sweep's close-out would find zero authorized records, produce
  # ~zero commits, and pass every assertion above cleanly. These three are the
  # actual enforcement of the spec's Gotcha ("write the eval so a future edit
  # that adds a dispatch call to sweep fails CI") — they fail regardless of
  # how many records exist or what they're authorized for.
  - type: tool-input-excludes
    contains: "claude-tweaks:dispatch"
  - type: tool-input-excludes
    contains: "claude-tweaks:flow"
  - type: tool-input-excludes
    contains: "claude-tweaks:build"
