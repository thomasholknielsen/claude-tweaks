name: assess-merge-check-matrix
description: >
  Runs every frozen merge-check-cases.json entry through one
  /claude-tweaks:assess-agent-autonomy merge-check invocation each, against a
  feature branch seeded with that entry's overlay diff on top of the shared
  merge-check-repo fixture base.

  Mirrors learning-routing-corpus-matrix.yaml's shape: selection is by
  exclusion, not by allowlist, so a corpus entry added later runs here
  automatically without editing this file. No entry is excluded today — no
  dedicated scenario file exists for any of the seven cases.
  evals/tests/merge-check-coverage.test.js enforces that every corpus entry
  is exercised by exactly one scenario.

  `--base main` short-circuits merge-check's integration-branch resolution
  ladder entirely (plugin/skills/assess-agent-autonomy/SKILL.md, Mode: merge-check,
  Step 1) — the contract under eval is the Step 2 judgment + Step 3 verdict,
  not the resolution ladder. The fixture's own .claude-tweaks/policy.yml still
  pins integration-branch: main, for a future scenario exercising resolution
  itself.
matrix:
  corpus: merge-check-cases.json
  entries: cases
fixture:
  base: merge-check-repo
  seed:
    - branch:
        name: feature
        base: main
        files: "{{matrix.files}}"
skill_invocation:
  prompt: >
    /claude-tweaks:assess-agent-autonomy merge-check #{{matrix.n}} --base main
assertions:
  - type: verdict-matches
    expected: "{{matrix.expected.verdict}}"
  - type: tool-count
    max: 25
  - type: commit-count
    max: 3
