name: backlog-grant-local-files-preflight-stop
description: >
  Boundary check for the machine-grant unit (#269/#270): does
  /claude-tweaks:backlog grant actually stop under work-backend: local-files
  rather than proceeding to evaluate its gate chain and stamp grants on a
  record that would look eligible (ready, risk:low, agent origin) under
  github-issues? grant mode's own Preflight (plugin/skills/backlog/SKILL.md,
  plugin/skills/backlog/grant-mode.md Step 0) documents the same full stop refine's
  grant sub-stage has: machine-granting is github-issues-only, with no
  exception when no interactive human is present. This is the same
  Preflight-boundary class the backlog-refine-permission-matrix-compliance
  and dispatch-local-files-preflight-stop scenarios pin for their skills —
  the sandbox denies all network egress (evals/README.md's Safety model), so
  the gate chain itself is unreachable here by construction; per-key refusal
  attribution is covered at the unit layer instead
  (tests/bin-lib/issues/grant-gate.test.js, one refusal case per gate key
  plus all-clear and cap-boundary cases — see #270's scope amendment). What
  this scenario pins is the one boundary the sandbox CAN reach: a
  local-files firing must write nothing, grant nothing, and touch no
  record. The fixture is a realistic, /init'd project (base: init-baseline,
  generated by evals/scripts/generate-init-fixture.js) with an explicit
  `work-backend: local-files` line in its CLAUDE.md — the same path any
  genuinely onboarded local-files project takes.
fixture:
  base: init-baseline
  seed:
    - local-record:
        slug: eligible-looking-candidate
        title: "Tighten retry backoff in the sync worker"
        facets: { stage: "ready", risk: "low", size: "low", origin: "capture" }
skill_invocation:
  prompt: "/claude-tweaks:backlog grant"
assertions:
  # recordPath follows the same allocateId behavior the sibling scenarios
  # confirmed directly: first seeded local-record in an empty specs/ dir gets
  # id 1. grants.build must STAY false (seeded without any grants facet —
  # absent reads as false, same convention the compliance scenario asserts):
  # for grant mode the violation direction is ADDING a grant, the exact
  # inverse of dispatch's stay-authorized check.
  - type: local-record-facet
    recordPath: "specs/1-eligible-looking-candidate.md"
    facet: "grants.build"
    equals: false
  - type: local-record-facet
    recordPath: "specs/1-eligible-looking-candidate.md"
    facet: "grants.merge"
    equals: false
  - type: local-record-facet
    recordPath: "specs/1-eligible-looking-candidate.md"
    facet: "stage"
    equals: "ready"
  # Unlike refine (whose priority/Related sub-stage legitimately writes even
  # when its grant sub-stage stops), grant mode has no other sub-stage: a
  # local-files firing stops completely at Preflight, so ONLY fixture-setup
  # commit shapes are legitimate. Any other commit means the mode granted,
  # built, or hand-edited something.
  - type: commit-messages-allowed
    allow:
      - '^init$'
      - '^seed base fixture$'
      - '^seed local work record: '
  # Fixture starts at exactly 3 commits (init + seed base fixture + 1 seeded
  # record) — same arithmetic dispatch-local-files-preflight-stop confirmed
  # empirically for its identical fixture shape.
  - type: commit-count
    max: 3
  - type: tool-count
    max: 20
