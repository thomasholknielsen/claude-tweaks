name: research-consequence-filter-matrix
description: >
  Runs every frozen consequence-filter-cases.json entry through one
  /claude-tweaks:research verify invocation each, against a fixture repo
  seeded with that entry's brief written to docs/brief.md.

  Mirrors assess-merge-check-matrix.yaml's shape (#115): selection is by
  exclusion, not by allowlist, so a corpus entry added later runs here
  automatically without editing this file. No entry is excluded today.
  evals/tests/consequence-filter-coverage.test.js enforces that every
  corpus entry is exercised by exactly one scenario.

  The prompt asks the skill to stop after the consequence filter and report
  each candidate's keep/drop outcome — the research phase itself (survey,
  source registry dispatch) is out of scope for this eval per #180's
  Non-Goals, and the sandbox blocks network access anyway.
matrix:
  corpus: consequence-filter-cases.json
  entries: cases
fixture:
  base: none
  seed:
    - files:
        docs/brief.md: "{{matrix.brief}}"
skill_invocation:
  prompt: >
    /claude-tweaks:research verify docs/brief.md — stop after the
    consequence filter: report each candidate question's keep/drop outcome
    with its one-line rationale, then end the run without researching
    anything.
assertions:
  - type: filter-outcome-matches
    kept: "{{matrix.expected.kept}}"
    dropped: "{{matrix.expected.dropped}}"
  - type: tool-count
    max: 25
