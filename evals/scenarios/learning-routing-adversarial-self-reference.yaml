name: learning-routing-adversarial-self-reference
description: >
  Unlike its sibling (learning-routing-adversarial-named-but-local.yaml),
  this lesson genuinely clears classifier rule 1 in full: "The wrap-up
  skill's Review Console renders its sections out of order when two stage
  files share a number" names a claude-tweaks skill AND describes a defect in
  its own rendering logic that would hold in any project using the plugin —
  nothing about it is project-specific. A naive classifier stops there and
  answers D5 (defect), which is the correct answer for every other project
  that depends on claude-tweaks as a plugin. It is the wrong answer here,
  because _shared/learning-routing.md's self-reference check exists for
  exactly this fixture's situation: before returning a D5 verdict,
  plugin/skills/feedback/SKILL.md Step 3 runs `git remote get-url origin`; when the
  remote resolves to the claude-tweaks repository itself, D5 collapses and
  the classifier re-runs from rule 4 — landing on D1, because the plugin
  never files issues against itself through this path. A classifier that
  fires rule 1 and never checks self-reference at all files a defect the
  project should instead hold as its own local record, producing a public
  issue no maintainer wants a duplicate of.

  The collapse depends on `git remote get-url origin` actually resolving to a
  claude-tweaks-shaped URL inside the fixture repo, which the git-remote seed
  step below supplies. That step exists because of this scenario (#157):
  freshRepo() configures no remote, and neither existing seed type can add
  one — local-record only writes under specs/, and apply-patch's underlying
  `git apply` hard-refuses any diff touching .git/ ("error: invalid path
  '.git/config'", exit 128). Until it existed, this scenario asserted D1 and
  was expected to FAIL, since the precondition it tests could not be
  presented; the assertion was deliberately never weakened to match the
  broken fixture, because a test rewritten to agree with current behavior can
  no longer tell correct from merely-current (IL-62).

  Corpus coverage: this file claims one corpus entry via covers_corpus_entry
  below; everything not claimed by a dedicated scenario is run by
  learning-routing-corpus-matrix.yaml. tests/learning-routing-coverage.test.js
  enforces that the two sets partition the corpus exactly, so an entry can
  neither go unexercised nor be paid for twice.
covers_corpus_entry: adversarial-self-reference
fixture:
  base: minimal-node-repo
  seed:
    # The whole point of this scenario: origin IS claude-tweaks, so a D5
    # verdict must collapse to a local record rather than filing upstream.
    - git-remote: https://github.com/thomasholknielsen/claude-tweaks.git
skill_invocation:
  prompt: >
    /claude-tweaks:feedback --dry-run "The wrap-up skill's Review Console
    renders its sections out of order when two stage files share a number."
assertions:
  - type: routing-destination-matches
    expectedDestination: D1
  # --dry-run must not file. No gh call can succeed here anyway, but a run that
  # attempts one is a contract violation regardless of the sandbox. Same
  # ceilings as learning-routing-classification.yaml: identical skill,
  # identical --dry-run shape, identical fixture base, so no adjustment.
  - type: tool-count
    max: 25
  - type: commit-count
    max: 2
