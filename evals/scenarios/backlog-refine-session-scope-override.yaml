name: backlog-refine-session-scope-override
description: >
  Second sibling to backlog-refine-permission-matrix-compliance.yaml (#1178),
  covering the session-scope override refine-lanes.md's confirm-gate section
  adds independently of the `autonomy` ceiling (below `unattended`, where
  backlog-refine-unattended-auto-apply.yaml's `refineAutoApply` branch does
  not apply at all — this fixture carries no .claude-tweaks/policy.yml, so
  `autonomy` resolves its `supervised` default). The story this pins: the
  first batch-confirm of a session resolves the ordinary 4-option
  `AskUserQuestion` (unchanged, still at its 4-option cap), immediately
  followed by a one-time 2-option follow-up asking whether to apply future
  batches the same way; answering "Yes" must suppress BOTH questions for
  every later batch this same session, each one still rendered in full and
  `[auto-applied]`-stamped. The eval harness's actor
  (evals/actor.js's createActor) auto-answers every `AskUserQuestion` by
  picking whichever option is labeled "(Recommended)", or an
  `answer_overrides` entry when one matches — so this scenario drives the
  first gate's default ("Apply all recommended (Recommended)") and overrides
  only the follow-up (whose own recommended default is "No, ask me every
  batch"), then instructs the model to invoke `/claude-tweaks:backlog refine`
  a second time in the same session against a second, still-unprioritized
  record. A build that failed to remember the override, or that re-asked
  either question on the second invocation, would leave the second record's
  priority unset (no human turn present in this harness to answer a second
  round) and would never log the session-override-specific decisions.md line
  this scenario pins. `--budget 1` on both invocations forces each one to
  treat its single seeded record as its own batch, matching the real-world
  multi-invocation story #1178 was filed from (a human re-running refine
  across several `--budget`-bounded passes over one large backlog). Same
  local-files boundary the sibling scenarios pin (no live gh/network in this
  sandbox) — this scenario only reaches the priority/Related sub-stage's
  confirm-gate, never the grant lane.
fixture:
  base: init-baseline
  seed:
    - local-record:
        slug: cache-invalidation-bug
        title: "Fix stale cache entries after a config reload"
        facets: { stage: "ready", risk: "low", size: "low" }
    - local-record:
        slug: retry-backoff-jitter
        title: "Add jitter to the sync worker's retry backoff"
        facets: { stage: "ready", risk: "low", size: "low" }
skill_invocation:
  prompt: >
    Two local work records in this repo are missing a priority label:
    specs/1-cache-invalidation-bug.md and specs/2-retry-backoff-jitter.md.
    Run `/claude-tweaks:backlog refine --budget 1` now — with --budget 1 it
    will only pick up the first record this pass. Once that run finishes,
    run `/claude-tweaks:backlog refine --budget 1` again, in this same
    session (do not start a new session or conversation), to process the
    second record. Do nothing else.
answer_overrides:
  - match: "apply future batches this session the same way"
    answer: "Yes, apply this way for the rest of this session"
assertions:
  # recordPath follows the same allocateId behavior the sibling scenarios
  # confirmed directly: the first seeded local-record gets id 1, the second
  # gets id 2, in seed order, against an empty specs/ dir.
  #
  # Both records end up with a priority written — the first via the ordinary
  # answered 4-option gate, the second via the session-scope override
  # resolving with no further prompt. Exact tiers are Step 2's own LLM
  # synthesis and are not pinned here.
  - type: file-contains
    path: "specs/1-cache-invalidation-bug.md"
    contains: ["priority:"]
  - type: file-contains
    path: "specs/2-retry-backoff-jitter.md"
    contains: ["priority:"]
  - type: local-record-facet
    recordPath: "specs/1-cache-invalidation-bug.md"
    facet: "stage"
    equals: "ready"
  - type: local-record-facet
    recordPath: "specs/2-retry-backoff-jitter.md"
    facet: "stage"
    equals: "ready"
  # The lane report renders in full and stamps every auto-applied row on
  # BOTH batches once the override is active — never zero-render.
  - type: result-contains
    contains: ["[auto-applied]"]
  # decisions.md must show the second batch resolving via the session-scope
  # override specifically (refine-lanes.md's literal wording for that
  # branch) — the one signal in this harness that distinguishes "the second
  # batch auto-applied because the override kicked in" from "the second
  # batch just happened to get answered the same way twice," since this
  # harness has no assertion primitive for "AskUserQuestion was not called."
  - type: decisions-log-has
    contains:
      - "per this session's standing override (chosen at the first batch-confirm)"
  # Legitimate commit shapes across both invocations: init + seed base
  # fixture + the two seeded records + one priority-write commit per record
  # ("Backlog Refine: set priority:{tier} on {id}").
  - type: commit-messages-allowed
    allow:
      - '^init$'
      - '^seed base fixture$'
      - '^seed local work record: '
      - '^Backlog Refine: '
  - type: commit-count
    max: 12
  - type: tool-count
    max: 80
