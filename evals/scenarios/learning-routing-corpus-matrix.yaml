name: learning-routing-corpus-matrix
description: >
  Runs every frozen corpus lesson that no dedicated scenario file already
  claims, one agent run per lesson, through the same
  /claude-tweaks:feedback --dry-run surface the dedicated scenarios use.

  Before the runner had a matrix construct (#158), covering an entry meant
  writing another near-identical scenario file, so four of the seven lessons
  in evals/fixtures/learning-routing-corpus/lessons.json were recorded and
  integrity-checked but exercised by nothing. That is the failure the corpus
  exists to prevent, one layer up: a fixture that looks like coverage while
  measuring nothing.

  Selection is by exclusion, not by allowlist. A lesson added to the corpus
  is picked up here automatically; only a lesson that gains its own dedicated
  scenario file gets excluded. tests/learning-routing-coverage.test.js
  enforces that the exclude list below and the dedicated files'
  covers_corpus_entry declarations partition the corpus exactly — no entry
  unexercised, none paid for twice.

  Three lessons keep dedicated files rather than joining this matrix, because
  each needs something a shared scenario cannot express: a distinct fixture
  (adversarial-self-reference needs origin to BE claude-tweaks, which would
  wrongly collapse D5 for every other lesson here), or a long-form rationale
  for why the case is adversarial.

  The fixture carries a deliberately non-claude-tweaks origin so the Step 3
  self-reference check resolves and returns "not self-reference" on its own
  terms — gap-no-opinion expects D5, and it should reach that verdict because
  origin is genuinely elsewhere, not because the check errored out.

  Expected destinations come from the corpus, substituted into the assertions
  below; they are never present in the prompt the model sees.
matrix:
  corpus: learning-routing-corpus/lessons.json
  entries: lessons
  exclude:
    - subagent-dispatch-anchor        # learning-routing-classification.yaml
    - adversarial-named-but-local     # learning-routing-adversarial-named-but-local.yaml
    - adversarial-self-reference      # learning-routing-adversarial-self-reference.yaml
fixture:
  base: minimal-node-repo
  seed:
    - git-remote: https://github.com/example-org/example-app.git
skill_invocation:
  prompt: >
    /claude-tweaks:feedback --dry-run "{{matrix.text}}"
assertions:
  - type: routing-destination-matches
    expectedDestination: "{{matrix.expected.destination}}"
    # null for every non-D5 lesson — the whole-placeholder substitution
    # preserves that null, and routing-destination-matches.js skips the kind
    # check when it is falsy.
    expectedKind: "{{matrix.expected.kind}}"
  # --dry-run must not file. No gh call can succeed here anyway, but a run that
  # attempts one is a contract violation regardless of the sandbox. Same
  # ceilings as learning-routing-classification.yaml: identical skill,
  # identical --dry-run shape, identical fixture base, so no adjustment.
  - type: tool-count
    max: 25
  - type: commit-count
    max: 2
