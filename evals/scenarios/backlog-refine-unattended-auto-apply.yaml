name: backlog-refine-unattended-auto-apply
description: >
  Sibling to backlog-refine-permission-matrix-compliance.yaml (#1178), covering
  the new `refineAutoApply` capability (`_shared/autonomy-ceiling.md`'s
  Bookkeeping capabilities table, `unattended`-only): at `autonomy: unattended`,
  /claude-tweaks:backlog refine's batch-confirm gate
  (`<!-- refine-confirm-gate -->` in refine-lanes.md) must skip its
  `AskUserQuestion` entirely and resolve the batch as "Apply all recommended"
  with zero clicks, while still rendering the full lane report and logging one
  lever-attributed `decisions.md` AUTO entry for the batch. This sandbox
  cannot reach the grant lane itself (work-backend: local-files stops the
  grant sub-stage completely at Preflight, same boundary the sibling scenario
  pins, and the sandbox has no live `gh`/network to exercise
  work-backend: github-issues) — what this scenario CAN and does pin is the
  confirm-gate's own auto-resolution mechanism via the priority/Related
  sub-stage, which legitimately proceeds and writes under local-files
  regardless of the grant sub-stage's stop. The fixture is a realistic,
  /init'd project (base: init-baseline, generated by
  evals/scripts/generate-init-fixture.js) with an explicit
  .claude-tweaks/policy.yml setting `autonomy: unattended` — the current
  (post-6.48.0) canonical policy home, seeded independently of init-baseline's
  own frozen pre-6.48.0 CLAUDE.md policy block (which predates the `autonomy`
  lever and carries no line for it at all — see
  evals/tests/frozen-fixture-policy-tolerance.test.js).
fixture:
  base: init-baseline
  seed:
    - files:
        .claude-tweaks/policy.yml: |
          autonomy: unattended
    - local-record:
        slug: rate-limit-public-api
        title: "Add rate limiting to the public API"
        facets: { stage: "ready", risk: "low", size: "low" }
skill_invocation:
  prompt: "/claude-tweaks:backlog refine"
assertions:
  # recordPath follows the same allocateId behavior the sibling scenarios
  # confirmed directly: the one seeded local-record in an empty specs/ dir
  # gets id 1 (specs/1-rate-limit-public-api.md).
  #
  # The record carries no priority facet at seed time (defaultFacets() leaves
  # it unset) — a written `priority:` line in the frontmatter is only
  # reachable if refine's priority/Related sub-stage actually applied its
  # suggestion, which under the unattended branch must happen with zero
  # AskUserQuestion calls. The exact tier is Step 2's own LLM synthesis call
  # and is not pinned here — only that the write happened at all.
  - type: file-contains
    path: "specs/1-rate-limit-public-api.md"
    contains: ["priority:"]
  - type: local-record-facet
    recordPath: "specs/1-rate-limit-public-api.md"
    facet: "stage"
    equals: "ready"
  # The lane report must still render in full (never zero-render) and stamp
  # every auto-applied row — the literal `[auto-applied]` marker
  # refine-lanes.md's rewritten confirm-gate section specifies.
  - type: result-contains
    contains: ["[auto-applied]"]
  # One decisions.md AUTO entry for the whole batch, lever-attributed to the
  # real POLICY_KEYS entry that gates it (`autonomy`, source `policy` since
  # this fixture sets it via .claude-tweaks/policy.yml) — refineAutoApply
  # itself is a derived capability name, never a loggable lever key, per
  # auto-decision-log.md's "keys are literal, copy from POLICY_KEYS" rule.
  - type: decisions-log-has
    contains:
      - "[lever: autonomy=unattended (policy)]"
  # Legitimate commit shapes: init + seed base fixture + the policy.yml seed
  # step (seedFiles' default "seed fixture files" message) + the one seeded
  # record + this skill's own priority-write commit
  # ("Backlog Refine: set priority:{tier} on {id}" — same convention the
  # sibling scenario's own comment confirms against a real run).
  - type: commit-messages-allowed
    allow:
      - '^init$'
      - '^seed base fixture$'
      - '^seed fixture files$'
      - '^seed local work record: '
      - '^Backlog Refine: '
  - type: commit-count
    max: 10
  - type: tool-count
    max: 50
