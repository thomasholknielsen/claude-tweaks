name: learning-routing-adversarial-named-but-local
description: >
  A naive classifier keys on classifier rule 1's first clause alone — "names a
  /claude-tweaks:* skill" — and stops there: this lesson literally says "the
  flow skill," so a shallow reader answers D5 (defect) and files it upstream
  against the plugin. That is wrong. Rule 1 has a second, equally load-bearing
  clause — "and would hold in any project using the plugin" — and this lesson
  fails it: "our CI publishes only from that branch" is a fact about this
  specific repository's own pipeline, not a claim about how the flow skill
  behaves anywhere else. The correct destination is D1 (classifier rule 4: "a
  rule about this codebase that must always be loaded"), not D5. Naming a
  skill is necessary for rule 1 but not sufficient; a classifier that treats
  it as sufficient files every project-local convention that happens to
  mention a skill name as a public plugin defect.

  This scenario never reaches plugin/skills/feedback/SKILL.md's Step 3 self-reference
  check at all: Step 2 classifies via _shared/learning-routing.md, finds the
  result is not D5, and stops immediately ("If it is not D5, stop. Report the
  destination the contract actually returned and hand the learning back to
  the caller."). So unlike its sibling scenario
  (learning-routing-adversarial-self-reference.yaml), this one has no
  dependency on git remote state and is fully testable against the existing
  minimal-node-repo fixture as-is.

  Corpus coverage: this file claims one corpus entry via covers_corpus_entry
  below; everything not claimed by a dedicated scenario is run by
  learning-routing-corpus-matrix.yaml. tests/learning-routing-coverage.test.js
  enforces that the two sets partition the corpus exactly, so an entry can
  neither go unexercised nor be paid for twice.
covers_corpus_entry: adversarial-named-but-local
fixture:
  base: minimal-node-repo
skill_invocation:
  prompt: >
    /claude-tweaks:feedback --dry-run "In this repository the flow skill must
    be run from the deploy branch, because our CI publishes only from that
    branch."
assertions:
  - type: routing-destination-matches
    expectedDestination: D1
  # --dry-run must not file. No gh call can succeed here anyway, but a run that
  # attempts one is a contract violation regardless of the sandbox. Same
  # ceilings as learning-routing-classification.yaml: identical skill,
  # identical --dry-run shape, identical fixture base, so no adjustment.
  - type: tool-count
    max: 25
  - type: commit-count
    max: 2
