name: capture-shaped-body-missing-reason
description: >
  Runtime pin for #697 AC 3 (capture's Shaped-body branch,
  plugin/skills/capture/SKILL.md "The deferral check"): a shaped idea body whose
  header carries an Origin: line (a content signal that this filing is a
  deferral, per SKILL.md's deferral-check rule), with NO --defer-reason=
  flag and no Defer-reason: line in the body text, must file NOTHING and
  report the missing reason — the same hard gate
  wrap-up/refused-proposals.md enforces at the Review Console. Deliberately distinct from AC 1's scenario (which
  also carries a reason, supplied via the flag) and from AC 2's scenario
  (whose --source-triggered deferral check is pre-empted by the
  needs:definition branch) — this body has a normal ## Acceptance Criteria
  section (not ## Open Question), so it does NOT take the needs:definition
  branch, and the Origin: line's deferral requirement is the only thing
  standing between it and a born-ready filing.
  Wrong-behavior trace: a build that silently dropped the missing-reason
  hard stop and filed the record anyway (treating Origin: as decorative
  text rather than a provenance/deferral signal) leaves specs/ non-empty —
  caught directly by the dir-file-count max: 0 ceiling below, the same
  mechanism evals/scenarios/wrap-up-fix-now-not-file.yaml uses to catch a
  ledger item filed instead of fixed.
  The report-text half of AC 3 ("the run reports the missing reason") is
  deliberately not pinned by any assertion here: the assertion registry
  (evals/assertions/index.js) has no generic "resultText contains this
  substring" type — the closest ones (findings-include, verdict-matches,
  routing-destination-matches, filter-outcome-matches) are all shape-specific
  to other skills' output formats and don't apply to capture's refusal
  report. The tool-count min: below is what guards against a silent no-op
  (an SDK error, a sandbox denial, or zero tool calls) standing in for a
  genuine refusal.
fixture:
  base: init-baseline
skill_invocation:
  prompt: >
    /claude-tweaks:capture "Origin: eval harness AC3 probe


    ## Current State

    This fixture project's search results list shows every result on one
    page, with no way to page through more than the first batch.


    ## Deliverables

    - [ ] Add pagination controls to the search results list.


    ## Acceptance Criteria

    1. The search results list paginates results instead of rendering every
    result on one page."
    --title="Add pagination to the search results list"
assertions:
  - type: dir-file-count
    path: "specs"
    max: 0
  - type: tool-count
    min: 3
    max: 30
