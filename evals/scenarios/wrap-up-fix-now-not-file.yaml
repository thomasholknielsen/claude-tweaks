name: wrap-up-fix-now-not-file
description: >
  Deferral-gate runtime pin (#621): a wrap-up run whose ledger holds four
  small in-diff items ("a few lines each") must FIX all four in-branch per
  _shared/deferral-gate.md's fix-now criteria — not file them as records.
  Mechanically checkable success shape, designed around wrap-up's own
  documented cleanup (a correct run DELETES the ledger after the resolve
  gate confirms zero open items — cleanup-procedures.md item 2): (a) the
  seeded tests pass, which is only possible if defects 1-2 were actually
  fixed; (b) the ledger file is GONE — it survives only if items were left
  open/unresolved; (c) zero new local records under specs/ (this repo shape
  files local records there, and the sandbox has no network for gh) — a run
  that "resolved" items by filing them fails here; (d) zero staged
  queue-write proposals in the run dir. The four seeded defects are each a
  few-line fix in a seeded file, so every one passes the fix-now criteria
  and none has a legitimate Defer-reason.
fixture:
  base: minimal-node-repo
  seed:
    - files:
        src/greet.js: |
          'use strict';
          // Defect 1 (ledger #1): greet() drops the exclamation mark the test expects.
          // Defect 3 (ledger #3): stray debug console.log left in greet().
          function greet(name) {
            console.log('greet called');
            return 'Hello, ' + name;
          }
          // This helper whispers the greeting quietly.
          // ^ Defect 4 (ledger #4): the comment above is wrong — shout() shouts.
          // Defect 2 (ledger #2): shout() lower-cases and also drops the exclamation mark.
          function shout(name) {
            return ('Hello, ' + name).toLowerCase();
          }
          module.exports = { greet, shout };
        test/greet.test.js: |
          'use strict';
          const { test } = require('node:test');
          const assert = require('node:assert');
          const { greet, shout } = require('../src/greet.js');
          // These tests encode the CORRECT behavior; the seeded defects fail them.
          test('greet appends an exclamation mark', () => {
            assert.strictEqual(greet('Ada'), 'Hello, Ada!');
          });
          test('shout upper-cases with exclamation mark', () => {
            assert.strictEqual(shout('Ada'), 'HELLO, ADA!');
          });
          test('greet handles empty name', () => {
            assert.strictEqual(greet(''), 'Hello, !');
          });
          test('shout handles empty name', () => {
            assert.strictEqual(shout(''), 'HELLO, !');
          });
        docs/plans/2026-08-16-greet-ledger.md: |
          # Open Items — greet module hardening

          | # | Phase | Item | Status | Resolution |
          |---|-------|------|--------|------------|
          | 1 | build | greet() drops the trailing exclamation mark ('Hello, Ada' vs expected 'Hello, Ada!') — src/greet.js, a few lines | open | — |
          | 2 | build | shout() lower-cases instead of upper-casing AND drops the exclamation mark — src/greet.js, a few lines | open | — |
          | 3 | review | stray debug console.log('greet called') left inside greet() — src/greet.js, one line | open | — |
          | 4 | review | comment above shout() says the helper "whispers" — it shouts; fix the comment — src/greet.js, one line | open | — |
skill_invocation:
  prompt: "/claude-tweaks:wrap-up"
assertions:
  # (a) The fixes are real: the seeded tests only pass post-fix.
  - type: test-passes
    command: "node --test test/*.test.js"
  # Defects 3-4 are test-invisible (a stray console.log, a wrong comment) —
  # pin their fixes directly in the source, which also keeps file-contains
  # exercised by a real scenario.
  - type: file-contains
    path: "src/greet.js"
    absent: ["console.log", "whispers"]
  # (b) The ledger is gone: wrap-up deletes it only after the resolve gate
  # confirms zero open items; a run that left items open (or never ran the
  # gate) leaves this file behind.
  - type: file-exists
    path: "docs/plans/2026-08-16-greet-ledger.md"
    shouldExist: false
  # (c) Zero records filed: a filed record would land as specs/N-*.md.
  - type: dir-file-count
    path: "specs"
    max: 0
  # (d) Zero staged queue-write proposals in the run dir wrap-up creates.
  - type: dir-file-count
    path: ".claude-tweaks/pipelines/*/staged"
    max: 0
  - type: tool-count
    max: 80
